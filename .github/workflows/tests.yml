name: Offline tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements.txt -c requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m tests.check_fly_ui
      - run: python -m tests.check_scan_ui
